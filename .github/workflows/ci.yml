name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m

      - name: Build binary
        run: go build -o pymon ./cmd/pymon

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pymon:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d -p 10000:10000 --name pymon --rm \
            -e JWT_SECRET=test-secret-for-ci \
            -e CONFIG_PATH=/config/config.example.yml \
            -e DATA_DIR=/tmp/pymon-data \
            pymon:${{ github.sha }}
          sleep 5
          curl -f http://localhost:10000/api/v1/health || exit 1
          docker stop pymon
