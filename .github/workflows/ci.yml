name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m

      - name: Build binary
        run: go build -o pymon ./cmd/pymon
