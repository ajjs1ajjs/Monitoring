name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release (e.g. v3.1.0)'
        required: true
        default: 'v3.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pymon-linux-amd64 ./cmd/pymon
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pymon-linux-arm64 ./cmd/pymon
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pymon-windows-amd64.exe ./cmd/pymon
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pymon-windows-arm64.exe ./cmd/pymon
          cd dist
          sha256sum * > checksums.txt

      - name: Create public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPO: ajjs1ajjs/Monitoring
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          test -n "$GH_TOKEN"
          gh release create "$TAG" dist/* --repo "$PUBLIC_REPO" --title "Monitoring $TAG" --generate-notes
