services:
  telegraf:
    image: telegraf:1.39.2
    container_name: telegraf
    ports:
      - "8125:8125/udp"
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - telegraf-data:/var/log/telegraf
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  pymon:
    image: pymon:3.0.6
    build: .
    ports:
      - "10000:10000"
    volumes:
      - pymon-data:/data
      - ./config.yml:/config/config.yml
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required! Set it in .env or environment}
      - CONFIG_PATH=/config/config.yml
      - DATA_DIR=/data
      - LOG_DIR=/logs
      - PYMON_ALLOWED_ORIGINS=http://localhost:10000,https://monitoring.example.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pymon-data:
  telegraf-data:
